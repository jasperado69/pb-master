<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Boris Bowl Watch</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="header container">
    <div>
      <p class="eyebrow">3-day friendly wager tracker</p>
      <h1>Boris Bowl Watch</h1>
    </div>
    <nav aria-label="Primary">
      <button class="tab active" data-tab="dashboard">Dashboard</button>
      <button class="tab" data-tab="admin">Boris Admin</button>
      <button class="tab" data-tab="bets">Bets</button>
    </nav>
  </div>

  <main id="app" class="container"></main>
  <footer class="container small">Private joke app: get Boris’s consent before tracking or sharing location.</footer>

  <script src="app.js" type="module"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
